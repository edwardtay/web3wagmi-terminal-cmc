name: cmc liquidation sample

# Snapshot CoinMarketCap's cross-exchange liquidation feed into the repo every
# thirty minutes.
#
# The API has no historical liquidation endpoint, so a percentile can only rank
# against what has been collected since polling started, and this app has no
# database. A committed series is the only store that survives a container
# restart, and it doubles as the public timestamped record of real API calls the
# hackathon submission asks for.
#
# The cadence is thirty minutes, and both constraints point at that number.
#
# 1. Actions minutes. This is 1,440 runs a month. Public repositories get
#    unlimited minutes and a private one gets 2,000, so thirty minutes fits
#    either and fifteen fits only a public repo.
# 2. Credits. Two calls a run is at most 2,880 credits a month against the
#    15,000 the free Basic tier allows, leaving 12,120 for the routes. At
#    fifteen minutes it would be 5,760 and /api/leverage would not fit beside
#    /api/forced. In practice GitHub delivers far fewer runs than the cron asks
#    for, so 2,880 is a ceiling and the real spend has been a fraction of it.
#
# The resolution this gives up costs little. The feed serves rolling 1h, 4h and
# 24h windows, so the window itself smooths: two samples inside the shortest one
# is enough to rank it, and a cascade stays in the 1h reading for an hour.

on:
  # The schedule is deliberately absent from this published copy. This
  # repository is a mirror, rebuilt on every sync, so a commit made here by CI
  # would be destroyed by the next rebuild. The job runs in the private working
  # repository and its output reaches this one through the replay.
  # schedule:
    # Asks for every 30 minutes and does not get it.
    #
    # Observed over the first night: 21:44, 23:53, 03:42. Roughly one run every
    # two hours. GitHub deprioritises scheduled workflows under load and drops
    # them outright at peak, and a low-traffic private repository is first in
    # the queue to be dropped.
    #
    # The schedule stays at 30 minutes because asking more often is how you get
    # more of them, and the cost of a dropped run is nothing. But no reader of
    # this file should take the cron as the cadence: the series has gaps by
    # design and everything downstream ranks against the samples it has rather
    # than assuming a grid. `percentile` refuses to rank under thirty of them.
    #
    # It also means the credit figure below is a ceiling rather than a spend.
    # - cron: "*/30 * * * *"
    # - cron: "*/30 * * * *"
  workflow_dispatch:

# Never let two runs append at once. A second run starting while the first is
# between its read and its push would write a sample against a stale file and
# lose one of them on the rebase.
concurrency:
  group: cmc-sample
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Take the sample
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: node scripts/cmc-sample.mjs

      - name: Commit it
        run: |
          set -euo pipefail
          git config user.name  "cmc-sampler"
          git config user.email "noreply@web3wagmi.com"
          git add data/liquidations
          # A run that read nothing has nothing to say. Exit clean rather than
          # failing, so a quiet upstream does not fill the run history with red.
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "cmc: liquidation sample $(date -u +%Y-%m-%dT%H:%MZ)"
          # A human commit can land between the checkout and the push. Rebase
          # onto it rather than failing the run, and try a few times, because at
          # this cadence a collision is a matter of when.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push raced, attempt $i"
            sleep $((i * 5))
          done
          exit 1
